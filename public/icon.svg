<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2228" />
      <stop offset="100%" stop-color="#121417" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#F97316" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer ambient glow ring -->
  <circle cx="256" cy="256" r="160" fill="#F97316" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Chef Hat / Cloche Vault Silhouette -->
  <!-- Chef hat base band -->
  <rect x="176" y="320" width="160" height="32" rx="8" fill="url(#goldGrad)" />
  
  <!-- Hat pleats / crown -->
  <path d="M192 320 C160 300, 144 250, 176 210 C184 170, 230 150, 256 168 C282 150, 328 170, 336 210 C368 250, 352 300, 320 320 Z" fill="url(#flameGrad)" />

  <!-- Central Culinary Flame inside the Vault -->
  <path d="M256 220 C240 246, 226 270, 226 290 C226 314, 239 328, 256 328 C273 328, 286 314, 286 290 C286 270, 272 246, 256 220 Z" fill="#FEF08A" />
  <path d="M256 250 C248 266, 240 280, 240 292 C240 306, 247 314, 256 314 C265 314, 272 306, 272 292 C272 280, 264 266, 256 250 Z" fill="#FFFFFF" />

  <!-- Little sparkle accents -->
  <circle cx="160" cy="180" r="8" fill="#FDE047" opacity="0.8" />
  <circle cx="352" cy="180" r="8" fill="#FDE047" opacity="0.8" />
  <circle cx="256" cy="130" r="10" fill="#F97316" />
</svg>
